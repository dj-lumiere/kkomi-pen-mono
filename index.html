// a grid that draws only the rows on screen
function virtualGrid(total, cellOf, opts = {}) {
  const box = el("div", { class: "vs" }), sp = el("div", { class: "sp" }); box.append(sp);
  const cw = opts.cw || 64, ch_ = opts.ch || 72; let cols = 1, drawn = new Map();
  function layout() { cols = Math.max(1, Math.floor((box.clientWidth - 4) / cw)); sp.style.height = Math.ceil(total / cols) * ch_ + "px"; drawn.forEach(r => r.remove()); drawn.clear(); draw(); }
  function draw() {
    const r0 = Math.max(0, Math.floor(box.scrollTop / ch_) - 4), r1 = Math.min(Math.ceil(total / cols), Math.ceil((box.scrollTop + box.clientHeight) / ch_) + 4);
    for (const [r, n] of drawn) if (r < r0 || r >= r1) { n.remove(); drawn.delete(r); }
    for (let r = r0; r < r1; r++) {
      if (drawn.has(r)) continue;
      const row = el("div", { class: "row", style: `top:${r * ch_}px;height:${ch_ - 2}px;grid-template-columns:repeat(${cols},1fr)` });
      for (let i = r * cols; i < Math.min(total, (r + 1) * cols); i++) row.append(cellOf(i));
      sp.append(row); drawn.set(r, row);
    }
  }
  box.addEventListener("scroll", () => requestAnimationFrame(draw), { passive: true });
  new ResizeObserver(layout).observe(box);
  box.goTo = i => { box.scrollTop = Math.floor(i / cols) * ch_; };
  return box;
}
